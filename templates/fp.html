{#<!doctype html>#}
<html lang="en">
{% load static %}
  <head>
  	<title>Login</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

	<link href="https://fonts.googleapis.com/css?family=Lato:300,400,700&display=swap" rel="stylesheet">

	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">

	<link rel="stylesheet" href="../static/login/css/style.css">
      <style>
          .header {
  background-color: rgba(0, 0, 0, 0); /* Fully transparent background */
  box-shadow: none; /* Remove any shadow for a clean transparent look */
  padding: 20px 0; /* Adjust padding to your preference */
  position: fixed; /* Keeps the navbar fixed at the top */
  width: 100%;
  z-index: 1000; /* Ensures it stays above other content */
}

.header h1 {
  color: white; /* Keep the text visible */
  font-size: 30px; /* Adjust the size of the title/logo */
}

.header .container {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* Adjust the text style within the navbar */
.header a {
  color: white; /* Make text and links visible against the transparent background */
  font-size: 18px;
  text-decoration: none;
}

.header a:hover {
  color: #ddd; /* Add a hover effect for better user experience */
}
  .highlight-text{
        color: #f5f6d9 ;
    }
    .bold-text{
        color: #e4e862;

    }
      </style>


	</head>
	<body class="img js-fullheight" style="background-image: url(../static/login/images/hero-bg.jpg);">
<header class="header">
  <div class="container">
    <div class="row justify-content-between align-items-center">
      <div class="col-md-6 col-lg-4">
         <h1>
  <span class="bold-text">H</span><span class="highlight-text">L</span><span>.</span>
</h1>
      </div>

    </div>
  </div>
</header>


	<section class="ftco-section">
		<div class="container">
			<div class="row justify-content-center">
				<div class="col-md-6 text-center mb-5">

				</div>
			</div>
			<div class="row justify-content-center">
				<div class="col-md-6 col-lg-4">
					<div class="login-wrap p-0">
		      	<h3 class="mb-4 text-center">Have an account?</h3>
		      	<form action="/forgot_password_post" method="post" class="signin-form">
		      		<div class="form-group">
		      			<input type="text" name="mail"class="form-control" placeholder="Email" required>
		      		</div>

	            <div class="form-group">
	            	<button type="submit" class="form-control btn btn-primary submit px-3">Sign In</button>
	            </div>

	          </form>

		      </div>
				</div>
			</div>
		</div>
	</section>

	<script src="../static/login/js/jquery.min.js"></script>
  <script src="../static/login/js/popper.js"></script>
  <script src="../static/login/js/bootstrap.min.js"></script>
  <script src="../static/login/js/main.js"></script>

	</body>
</html>
