<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking History</title>
     <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }
        .book-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
        }
        .book-card {
            background-color: #fff;
            border-radius: 5px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            padding: 20px;
            width: 30%; /* Ensures 3 cards in a row */
            box-sizing: border-box;
        }
        .book-card h3 {
            margin-top: 0;
        }
        .book-card p {
            margin: 10px 0;
        }
        .book-card .date {
            font-size: 0.9em;
            color: #555;
        }
        .book-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 5px;
            margin-bottom: 15px;
        }
        .book-card a {
            text-decoration: none;
            color: white;
            background-color: #28a745;
            padding: 10px 15px;
            border-radius: 5px;
            display: inline-block;
            margin-top: 10px;
        }
        .pagination {
            text-align: center;
            margin-top: 20px;
        }
        .pagination a {
            text-decoration: none;
            color: white;
            background-color: #007bff;
            padding: 10px 15px;
            margin: 0 5px;
            border-radius: 5px;
            display: inline-block;
        }
        .pagination span.current {
            background-color: #0056b3;
            color: white;
            padding: 10px 15px;
            margin: 0 5px;
            border-radius: 5px;
        }
        /* Star Rating */
        .star-rating {
            display: flex;
            flex-direction: row-reverse;
            justify-content: center;
        }

        .star-rating input[type="radio"] {
            display: none;
        }

        .star-rating label {
            color: #ddd;
            font-size: 2em;
            padding: 0 0.1em;
            cursor: pointer;
            transition: color 0.2s ease-in-out;
        }

        .star-rating input[type="radio"]:checked ~ label {
            color: #ffc107;
        }

        .star-rating label:hover,
        .star-rating label:hover ~ label {
            color: #ffc107;
        }
        .custom-request-btn {
        background-color: #ff5733; /* Change this to your desired color */
        color: white; /* Change text color if needed */
        padding: 10px 15px;
        border-radius: 5px;
        text-decoration: none; /* Remove underline */
        display: inline-block;
    }
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: space-around;
            padding: 1rem;
            z-index: 1;
        }

        .navbar a {
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .navbar a:hover {
            color: #ffd700;
        }
    </style>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f4f9;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 20px;
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
            color: #333;
            font-size: 2rem;
        }

        .table-container {
            overflow-x: auto;
        }

        .booking-table {
            width: 100%;
            border-collapse: collapse;
            background-color: #fff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .booking-table th, .booking-table td {
            padding: 15px;
            text-align: left;
            color: #555;
            border-bottom: 1px solid #eee;
        }

        .booking-table th {
            background-color: #333;
            color: #fff;
        }

        .profile-pic {
            width: 50px;
            height: 50px;
            border-radius: 50%;
        }

        .status {
            padding: 5px 10px;
            border-radius: 12px;
            color: #fff;
        }

        .status.completed {
            background-color: #28a745;
        }

        .status.pending {
            background-color: #ffc107;
        }

        @media (max-width: 768px) {
            .booking-table th, .booking-table td {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Booking History</h1>
        <a href="/employee" class="btn btn-info">Back</a>
<br/>
<br/>
    <form method="post" action="employee_view_shedule_post">
          <div class="table-container">
            <table class="booking-table">
                <thead>
                    <tr>

                        <th>Date </th>
                        <th colspan="4"><input type="date" name="d" value="{{ d }}" required class="form-control">  </th>
                        <th><input type="submit" value="Search" class="btn btn-primary"></th>

                    </tr>
                </thead>
            </table>
          </div>
    </form>
        <div class="table-container">
            <table class="booking-table">
                <thead>
                    <tr>

                        <th>User </th>
                        <th>User Name</th>
                        <th>Services </th>
                        <th>Date </th>
                        <th>Time Slot</th>
                        <th>Status</th>

                    </tr>
                </thead>
                <tbody>
                {% for i in val %}
                    <tr>
{#                        <td><img src="{{i.BOOKING_MASTER.USER.photo.url}}" alt="User 1" class="profile-pic"></td>#}
{#                        <td>{{i.BOOKING_MASTER.USER.name}}</td>#}
                        <td><img src="{{ i.USER.photo.url }}" alt="Employee 1" class="profile-pic"></td>
                        <td>{{ i.USER.name }}</td>
                        <td>
                            <table>
                            {% for  j in i.sub %}
                                <tr>
                                <td>
                            <p>
                            <img src="{{ j.img }}" alt="Employee 1" class="profile-pic">
                            </p></td><td>{{ j.sn }}</td>
</tr>
                            {% endfor %}
                    </table>
                            </td>
                        <td>{{ i.date }}</td>
                        <td>{{ i.From_time }} To {{ i.To_time }}</td>
                        <td>{{ i.status }}</td>

{#                        <td><span class="status completed">Completed</span></td>#}
                    </tr>
                {% endfor %}

                </tbody>
            </table>
        </div>
    </div>


</body>
</html>
