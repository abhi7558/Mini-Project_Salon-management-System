{% extends 'admin/adminhome.html' %}
{% block body %}
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1" />
    <title>Employee Form</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/5.1.3/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url('/static/registration/images/hero-bg.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            margin: 0;
            padding: 0;
            color: #fff; /* Changed text color to white for better contrast */
        }
        form {
            max-width: 800px;
            margin: 100px auto; /* Center form and add top margin */
            background: rgba(0, 0, 0, 0.7); /* Semi-transparent black for form background */
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5); /* Softer shadow for subtle depth */
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 15px;
            text-align: left;
        }
        th {
            background-color: rgba(255, 255, 255, 0.2); /* Slightly transparent background for header */
        }
        input[type="text"], input[type="password"], input[type="file"], input[type="email"], select {
            width: 100%;
            padding: 12px;
            margin: 6px 0;
            border: 1px solid rgba(255, 255, 255, 0.5); /* Light border for inputs */
            border-radius: 5px;
            background-color: rgba(255, 255, 255, 0.1); /* Transparent white for inputs */
            color: #fff; /* White text for inputs */
        }
        input[type="text"]:focus, input[type="password"]:focus, input[type="email"]:focus, select:focus {
            border-color: #4CAF50; /* Green border on focus */
            outline: none;
            background-color: rgba(255, 255, 255, 0.2); /* Lighten background on focus */
        }
        input[type="submit"] {
            background-color: #4CAF50; /* Green background */
            color: white; /* White text */
            border: none;
            padding: 12px 20px;
            text-align: center;
            display: inline-block;
            font-size: 16px;
            margin: 10px 0;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }
        input[type="submit"]:hover {
            background-color: #45a049; /* Darker green on hover */
            transform: scale(1.05); /* Slight zoom on hover */
        }
        /* Toast styles */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1050;
            display: none; /* Hide by default */
        }
        /* Style for select dropdown and its options */
        select {
            background-color: rgba(255, 255, 255, 0.1); /* Transparent background */
            color: #fff; /* White text for select */
        }
        option {
            color: black; /* Black text for options */
            background-color: #fff; /* White background for options */
        }
    </style>
</head>
<body>
    <form action="/add_empp" method="post" enctype="multipart/form-data" name="form1" id="form1" onsubmit="showToast();">
        {% csrf_token %}
        <table>
            <tr>
                <td>Name </td>
                <td><input type="text" name="textfield" required pattern="[a-zA-Z .]+"/></td>
            </tr>
            <tr>
                <td>Phone</td>
                <td><input type="text" name="textfield2" required pattern="[9876][0-9]{9}"/></td>
            </tr>
            <tr>
                <td>Image</td>
                <td><input type="file" name="file" required accept="image/*" /></td>
            </tr>
            <tr>
                <td>Experience</td>
                <td><input type="text" name="textfield3" required pattern="[0-9a-zA-Z ]+" /></td>
            </tr>
            <tr>
                <td>Language</td>
                <td><input type="text" name="textfield6" pattern="[a-zA-Z .,]+"/></td>
            </tr>
            <tr>
                <td>Email</td>
                <td><input type="email" name="textfield4" required pattern="[a-z0-9._]+[@][a-z]+[.][a-z]+" title="sample@domain.com"/></td>
            </tr>
            <tr>
                <td>Employee type</td>
                <td>
                    <select name="Employee_type">
                        <option value="Trainee">Trainee</option>
                        <option value="Senior Hairstylist">Senior Hairstylist</option>
                        <option value="Hairstylist">Hairstylist</option>
                        <option value="Skincare Consultant">Skincare Consultant</option>
                        <option value="Makeup Artist">Makeup Artist</option>
                        <option value="Nail Technician">Nail Technician</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Password </td>
                <td><input type="password" name="textfield5" required pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters" /></td>
            </tr>
            <tr>
                <td></td>
                <td><input type="submit" name="Submit" value="Submit" /></td>
            </tr>
        </table>
    </form>

    <!-- Toast Notification -->
    <div class="toast" id="employeeAddedToast" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="toast-header">
            <strong class="me-auto">Success</strong>
            <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
        <div class="toast-body">
            Employee successfully added!
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/5.1.3/js/bootstrap.min.js"></script>

    <script>
        function showToast() {
            const toastElement = document.getElementById('employeeAddedToast');
            const toast = new bootstrap.Toast(toastElement);
            toast.show();
        }

        $(document).ready(function() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('toast') && urlParams.get('toast') === 'success') {
                showToast();
            }
        });
    </script>
</body>
{% endblock %}
