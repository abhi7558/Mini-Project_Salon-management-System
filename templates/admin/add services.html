{% extends 'admin/adminhome.html' %}
{% block body %}
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1" />
    <title>Employee Form</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/5.1.3/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url('/static/login/images/hero-bg.jpg');
            background-size: cover;
            background-position: center;
            margin: 0;
            padding: 20px;
            color: #fff;
        }
        form {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(0, 0, 0, 0.7); /* Black with transparency */
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px;
            text-align: left;
        }
        td {
            border-bottom: none; /* Remove horizontal lines */
        }
        th {
            background-color: rgba(255, 255, 255, 0.1);
            border-bottom: none; /* Remove horizontal lines for header */
        }
        input[type="text"], input[type="password"], input[type="file"], input[type="email"], select {
            width: 100%;
            padding: 8px;
            margin: 4px 0;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 4px;
            background-color: rgba(255, 255, 255, 0.1);
            color: #fff;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus, input[type="password"]:focus, input[type="email"]:focus, select:focus {
            border-color: #4CAF50;
            outline: none;
        }
        select option {
            background-color: #fff; /* Background color of options */
            color: #000; /* Text color of options */
        }
        input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 15px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 10px 0;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.3s, transform 0.3s;
        }
        input[type="submit"]:hover {
            background-color: #45a049;
            transform: scale(1.05);
        }
        /* Toast styles */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1050;
            display: none; /* Hide by default */
        }
    </style>
</head>
<body>
    <form action="/add_services" method="post" enctype="multipart/form-data" name="form1" id="form1" onsubmit="showToast();">
        {% csrf_token %}
        <table>
            <tr>
                <td>NAME</td>
                <td><input type="text" name="name" required pattern="[a-zA-Z .]+"/></td>
            </tr>
            <tr>
                <td>DESCRIPTION</td>
                <td><input type="text" name="details" required pattern="[a-zA-Z ,.']+[-? ]*"/></td>
            </tr>
            <tr>
                <td>IMAGE</td>
                <td><input type="file" name="file" required accept="image/*" /></td>
            </tr>
            <tr>
                <td>PRICE</td>
                <td><input type="text" name="cost" required pattern="[0-9a-zA-Z ]+" /></td>
            </tr>
            <tr>
                <td>Duration (In minutes)</td>
                <td><input type="text" name="du" required pattern="[0-9]+" /></td>
            </tr>
            <tr>
                <td>TYPE</td>
                <td>
                    <select name="type">
                        <option value="Men">Men</option>
                        <option value="Women">Women</option>
                        <option value="Kids">Kids</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>CATEGORY</td>
                <td>
                    <select name="category">
                        <option value="Hair">Hair</option>
                        <option value="Face and Beauty">Face and Beauty</option>
                        <option value="Special Packages">Special Packages</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td></td>
                <td><input type="submit" name="Submit" value="Submit" /></td>
            </tr>
        </table>
    </form>

    <!-- Toast Notification -->
    <div class="toast" id="employeeAddedToast" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="toast-header">
            <strong class="me-auto">Success</strong>
            <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
        <div class="toast-body">
            Employee successfully added!
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/5.1.3/js/bootstrap.min.js"></script>

    <script>
        function showToast() {
            const toastElement = document.getElementById('employeeAddedToast');
            const toast = new bootstrap.Toast(toastElement);
            toast.show();
        }

        $(document).ready(function() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('toast') && urlParams.get('toast') === 'success') {
                showToast();
            }
        });
    </script>
</body>
{% endblock %}
