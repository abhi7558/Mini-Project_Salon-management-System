<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Payments</title>
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }
        .container {
            width: 90%;
            max-width: 1000px;
            margin: 20px auto;
        }
        h1 {
            margin-bottom: 20px;
            color: #333;
            font-size: 2rem;
            text-align: center;
        }
        .table-container {
            overflow-x: auto;
        }
        .payments-table {
            width: 100%;
            border-collapse: collapse;
            background-color: #fff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .payments-table th, .payments-table td {
            padding: 15px;
            text-align: left;
            color: #555;
            border-bottom: 1px solid #eee;
        }
        .payments-table th {
            background-color: #333;
            color: #fff;
        }
        .status {
            padding: 5px 10px;
            border-radius: 12px;
            color: #fff;
        }
        .status.completed {
            background-color: #28a745;
        }
        .status.pending {
            background-color: #ffc107;
        }
        .status.failed {
            background-color: #dc3545;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Admin Payments</h1>

<a href="/adminhome" class="btn btn-info" >Back</a>
    <br/>
    <br/>
        <div class="table-container">
            <table class="payments-table">
                <thead>
                    <tr>
                        <th>Payment ID</th>
                        <th>User Name</th>
                        <th>Amount</th>
                        <th>Date</th>

                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    {% for payment in pay %}
                        <tr>
                            <td>{{ payment.id }}</td>
                            <td>{{ payment.ORDER.USER.name }}</td>
                            <td>{{ payment.ORDER.amount }}</td>
                            <td>{{ payment.date }}</td>


                            <td>
                                <span class="status {% if payment.status == 'Completed' %}completed{% elif payment.status == 'Pending' %}pending{% else %}failed{% endif %}">
                                    {{ payment.status }}
                                </span>
                            </td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
